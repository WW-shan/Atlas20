project_name: Atlas20 Rotation
start_date: '2021-01-01'
end_date: null
initial_capital: 100000.0
annualization_days: 365

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  reports_dir: reports/latest

logging:
  level: INFO

universe:
  universe_size: 20
  current_top_n_candidates: 60
  # Historical watchlist.
  #
  # The candidate pool cannot be "today's top-N" only: a coin that was top-20
  # in 2021 and has since collapsed would never be in the pool, so the backtest
  # would never have had to hold it. That is the worst possible survivorship
  # bias for a momentum strategy, because the hottest coins are exactly the
  # ones that blow up. Terra (LUNC/UST), FTX (FTT) and Celsius all ranked
  # inside the Top-20 at some point and are long gone from today's leaders.
  #
  # Anything listed here is onboarded with its full real history on the next
  # refresh; it only ever enters the universe if it actually clears the
  # point-in-time market-cap rank.
  legacy_candidate_ids:
    - eos
    - monero
    - near
    - algorand
    - filecoin
    - internet-computer
    - tezos
    - the-graph
    - fantom
    - decentraland
    - theta-token
    - axie-infinity
    - hedera-hashgraph
    - vechain
    - neo
    - aave
    - maker
    - render-token
    - arbitrum
    - optimism
    - immutable-x
    - injective-protocol
    # Retired large caps: still fetchable, no longer in the current top-N.
    - cosmos
    - ethereum-classic
    - matic-network
    - polygon-ecosystem-token
    - kaspa
    - kucoin-shares
    - pancakeswap-token
    - jupiter-exchange-solana
    - aptos
    - curve-dao-token
    - celestia
    - lido-dao
    - sei-network
    - terra-luna
    - terra-luna-2
    - ftx-token
    - celsius-degree-token
    - ethereum-name-service
    - compound-governance-token
    - thorchain
    - chiliz
    - 1inch
    - apecoin
    - havven
    - basic-attention-token
    - the-sandbox
    - elrond-erd-2
    - dydx-chain
    - gala
    - helium
    - yearn-finance
    - zilliqa
    - sushi
    - enjincoin
    - flow
    - osmosis
    - waves
    - stepn
    - huobi-token
    - bitcoin-sv
  # Tickers CMC no longer lists in its symbol->id map but still serves history
  # for, keyed by the ticker CoinGecko reports. Without an entry here the
  # candidate is dropped as "no CoinMarketCap id" and its point-in-time Top-20
  # slots are silently handed to the next-ranked coin.
  #
  # MATIC is the one that mattered: it ranked inside the real Top-20 on 123 of
  # the strategy's 215 rebalance dates (best rank 6) and was missing from the
  # panel until 2026-09-22. CMC does still serve the series (2,158 rows to
  # 2025-03-24, when the token migrated to POL) - an earlier check concluded
  # otherwise because the client gave up on the first empty page (see
  # `_EMPTY_PAGE_REWIND_SECONDS`). Fantom is deliberately absent: it never
  # ranked better than 21st on a rebalance date, so it displaced nobody.
  cmc_symbol_aliases:
    EOS: 1765
    MKR: 1518
    HT: 2502
    CEL: 5692
    MATIC: 3890
    FTM: 3513
  # Historical watchlist coins the panel provably cannot carry, with the reason
  # and the cost. Anything in `legacy_candidate_ids` that is neither onboarded
  # nor listed here fails the data-chain audit, so a name cannot silently
  # disappear from the point-in-time Top-20 the way MATIC did.
  legacy_unavailable:
    bitcoin-sv: >-
      CoinGecko deleted the coin, and the panel is keyed on its CoinGecko id, so
      there is no candidate row to onboard. It held a real Top-20 slot on 7 of
      the strategy's 215 rebalance dates (all in 2021-2022); on those dates the
      next-ranked coin is promoted in its place.
  min_history_days: 90
  min_daily_dollar_volume: 25000000
  min_price: 0.000001
  # Liquidity gate: keep an asset only if it turns over >= 1% of its market cap
  # per day, or trades >= $200M/day in absolute terms. This retains real
  # mega-caps like Binance Coin that legitimately run a low turnover ratio.
  # Rain (RAIN) cleared the turnover gate only marginally during its brief
  # 2026 Top20 appearances; it is explicitly excluded below because the user
  # rejected that name as a tradable strategy candidate.
  min_turnover_ratio: 0.01
  min_turnover_volume_usd: 200000000
  exclude_wrapped_assets: true
  stablecoin_ids:
    - tether
    - usd-coin
    - dai
    - first-digital-usd
    - usds
    - frax
    - true-usd
    - usdd
    - paypal-usd
    - pax-gold
    - pax-dollar
    - usdb
    - ethena-usde
    - tether-gold
  excluded_ids:
    - wrapped-bitcoin
    - weth
    - wrapped-steth
    - staked-ether
    - lido-staked-ether
    - rocket-pool-eth
    - coinbase-wrapped-btc
    - ether-fi-staked-eth
    - wrapped-eeth
    - renbtc
    # Explicit user-level exclusion: do not let a marginal-turnover 2026
    # entrant displace an established Top20 name in strategy selection.
    - rain
  name_exclusion_keywords:
    - usd
    - treasury
    - fund
    - liquidity
    - institutional
    - wrapped
    - bridged
    - liquid staked
    - staked ether
    - restaked
    - heloc
  symbol_exclusion_keywords:
    - usd
    - usdt
    - usdc
    - dai
    - fdusd
    - tusd
    - usdd
    - usde
    - wbtc
    - steth
    - wsteth
    - cbeth
    - reth
    - weth
  category_exclusion_keywords:
    - stablecoins
    - fiat-backed
    - tokenized treasury
    - treasury-backed
    - treasury
    - money market
    - institutional fund
    - yield-bearing stablecoin
    - asset-backed stablecoin
    - liquid staking tokens
    - wrapped tokens

regime:
  btc_ma_window: 120
  tracked_total_mcap_ma_window: 120
  tracked_alt_mcap_momentum_window: 60
  use_btc_ma: true
  use_tracked_total_mcap_ma: true
  use_tracked_alt_momentum: false
  combine_method: all

rebalancing:
  frequencies:
    monthly: month_end
    biweekly: 14D

frictions:
  fee_bps: 10.0
  slippage_bps: 10.0
  max_weight_per_coin: 0.35
  max_weight_per_sector: 0.50
  # Missing provider prices abort the backtest by default. Do not silently
  # mark a halted or delisted holding as flat; use an explicit fill policy only
  # for a labelled sensitivity run.
  missing_return_policy: error
  missing_return_fill: -1.0

signals:
  momentum_windows:
    '30': 0.5
    '60': 0.3
    '90': 0.2
  sector_score_weights:
    ret_20_rank: 0.4
    ret_60_rank: 0.4
    btc_relative_60: 0.2

strategies:
  momentum_hold_counts: [4, 6, 8]
  momentum_frequencies: [monthly, biweekly]
  sector_top_k: [2, 3, 4]
  sector_frequencies: [monthly, biweekly]
  sector_max_coins_per_sector: 2
  include_bull_filter_variants: true
  include_small_cap_comparison: false

providers:
  # CoinGecko supplies the candidate catalog, coin metadata, and the fallback
  # second-source price check for assets Gate.io does not list.
  coingecko:
    base_url: https://api.coingecko.com/api/v3
    rate_limit_seconds: 1.25
    timeout_seconds: 30
    vs_currency: usd
  # CoinMarketCap supplies every historical price, volume and market cap.
  coinmarketcap:
    base_url: https://api.coinmarketcap.com/data-api/v3.1
    history_start: '2020-01-01'
    timeout_seconds: 30
    convert_id: '2781'
    page_size: 400
    request_interval_seconds: 1.0
  # Gate.io is the preferred independent exchange-venue check for every listed
  # asset. Its public candles have no CoinGecko/CoinPaprika-style 60/hour
  # limit and still cover delisted assets such as HT and CEL.
  gateio:
    base_url: https://api.gateio.ws/api/v4
    timeout_seconds: 30
    max_retries: 3
    retry_backoff_seconds: 1.0
    rate_limit_seconds: 0.05
    quote_currency: USDT
    pair_aliases: {}
  # A second exchange venue. Gate.io alone cannot corroborate itself: when CMC
  # disagrees with it there is no way to tell which side is wrong. Binance's
  # api.binance.com answers 451 from this host and api.binance.us is a far
  # thinner market (51 of its 73 panel pairs traded under $10k/day), so the
  # venue is reached through Binance's official public data mirror
  # data-api.binance.vision - same book, no key, no geo-block. It carries no
  # history for delisted names (HT, CEL answer "Invalid symbol"), so it
  # supplements Gate.io rather than replacing it. Like every other validator it
  # only votes; CMC still owns panel values.
  binance:
    base_url: https://data-api.binance.vision/api/v3
    timeout_seconds: 30
    max_retries: 3
    retry_backoff_seconds: 1.0
    rate_limit_seconds: 0.1
    quote_currency: USDT
    history_days: 400
    # Thin days are dropped rather than counted: a $2/day "close" is a stale
    # print, and counting it would block a healthy asset as a false
    # disagreement with CMC.
    min_daily_dollar_volume: 100000.0
    pair_aliases: {}
  # CoinPaprika is the final fallback when neither the second source nor
  # CoinGecko can provide the tie-break vote. Its free historical endpoint is
  # limited to the trailing 365 days.
  coinpaprika:
    base_url: https://api.coinpaprika.com/v1
    timeout_seconds: 30
    max_retries: 3
    retry_backoff_seconds: 2.0
    rate_limit_seconds: 0.25
    id_aliases: {}

reporting:
  rolling_window_days: 365
  selected_strategies_for_plots:
    - BTC_BH__always_on
    - ETH_BH__always_on
    - TOP20_EQ__always_on
    - TOP20_MOM_top6_monthly__always_on
    - TOP20_MOM_top6_monthly__bull_only
    - TOP20_SECTOR_top3_monthly__always_on
    - TOP20_SECTOR_top3_monthly__bull_only

data_quality:
  # An asset must carry this much real provider history before it can be
  # ranked. There is no synthetic market-cap fallback: no supply data means
  # the asset simply is not tradable in this universe.
  min_price_days: 60
  min_market_cap_days: 60
  # Do not append a new UTC date to the panel until at least this fraction of
  # admitted assets has a CMC row for that date. CMC updates assets
  # asynchronously, and a one-asset partial date creates terminal NaN returns
  # for every other holding.
  min_daily_coverage: 0.9
  require_metadata: false
  # Recent CMC prints are verified against Gate.io (or CoinGecko for unlisted
  # assets) before an asset is allowed into the panel; a disagreement triggers
  # an independent tie-break check. CMC is the only price source, so a bad
  # block there would otherwise be invisible.
  cross_check_recent_days: 365
  cross_check_min_overlap_days: 30
  cross_check_max_median_gap: 0.10
  cross_check_max_latest_gap: 0.35
  # The independent source must cover the primary provider's latest date.
  # Otherwise the comparison can pass on an old overlap while a fresh bad block
  # remains invisible. Zero means the latest dates must match.
  cross_check_max_latest_staleness_days: 0
  exclude_on_cross_check_failure: true
  # Refuse assets whose independent source is missing or stale. This makes the
  # live universe fail closed instead of trading an unverified current print.
  require_cross_check: true
