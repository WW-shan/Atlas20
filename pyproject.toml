[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas20-rotation"
version = "0.1.0"
description = "Atlas20 Rotation research framework for crypto momentum and sector rotation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Atlas20 contributors"}]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "requests>=2.32",
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "pydantic-settings>=2.0",
  "structlog>=24.0",
  "sqlmodel>=0.0.22",
  "alembic>=1.13",
  "filelock>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.28",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
